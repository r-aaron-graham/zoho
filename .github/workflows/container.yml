name: Container and security verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . bandit==1.8.6
      - run: bandit -q contacts.py
      - run: crm-normalize
        working-directory: ${{ runner.temp }}
      - run: docker build -t crm-mapping .
      - run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --network none crm-mapping python -m unittest -v
